name: Build iOS (unsigned IPA)

# Zkompiluje appku na macOS runneru a nahraje nepodepsané .ipa jako artefakt.
# Podpis se dělá až potom na Windows přes Sideloadly/AltStore (Apple ID zdarma).
# Veřejné repo = minuty zdarma i pro macOS.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalace závislostí
        run: npm install

      - name: Přidat iOS platformu
        run: npx cap add ios

      - name: Ikony a splash
        run: npx @capacitor/assets generate --ios || true

      - name: Sync
        run: npx cap sync ios

      - name: Build (nepodepsaný archiv)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Zabalit .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qry PiratskyPoklad-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PiratskyPoklad-unsigned-ipa
          path: app/build/PiratskyPoklad-unsigned.ipa
          if-no-files-found: error
